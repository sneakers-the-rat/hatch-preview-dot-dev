  /**
 * CSP wildcard for our Vercel preview deployments.
 *
 * Today preview deploys are served as subdomains of `hatch.ecto1.ai`, which
 * means they're already covered by the broader `*.ecto1.ai` entry below.
 * The duplicate entry here is intentional: it documents that previews are
 * a distinct trust principal, and it gives us a single line to swap when we
 * move them to a registration-isolated apex (see below).
 *
 * Why we'll want to move: a `*.preview.hatch.ecto1.ai` host shares an
 * eTLD+1 with prod (`hatch.ecto1.ai`), so attacks that piggyback on
 * same-site cookies, document.domain, or `*.ecto1.ai`-scoped CSP entries
 * become possible against prod from any compromised preview. Concretely:
 * an attacker who compromises a contributor's GitHub account can push a
 * malicious branch, Vercel auto-deploys it to `<pr>.preview.hatch.ecto1.ai`,
 * and that page now sits inside the same site as prod with permission to
 * iframe / postMessage / read same-site cookies — enough to lift access
 * tokens out of Spaces or the chat UI. Buying a separate apex (e.g.
 * `hatch-preview.dev`) and pointing previews there eliminates the
 * same-site relationship and contains the blast radius to the preview
 * domain itself.
 */
export const HATCH_PREVIEW_DEPLOY_HOST_PATTERN = &quot*.preview.hatch.ecto1.ai&quot;">
